# ==============================================================================
# Nginx Configuration for PrettyVision Optical
# Optimized for: 1 GB RAM VPS behind Cloudflare CDN Shield
# Path on VPS: /etc/nginx/sites-available/pretty-vision
# ==============================================================================

# Rate Limiting Zones (Memory: 10MB per zone tracks ~160,000 unique IP addresses)
limit_req_zone $binary_remote_addr zone=pv_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pv_auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=pv_conn_limit:10m;

upstream pv_node_backend {
    server 127.0.0.1:5070;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name prettyvision.in www.prettyvision.in;

    # Maximum file upload ceiling matching backend multer
    client_max_body_size 30M;
    client_body_buffer_size 128k;

    # Low-memory timeouts to free up file descriptors quickly
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Frontend SPA Root
    root /var/www/pretty-vision/frontend/dist;
    index index.html;

    # Static Vite Assets with 1-Year Immutable Browser Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded media (images/PDFs) served by Nginx or backend fallback
    location /uploads/ {
        alias /var/www/pretty-vision/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri @backend;
    }

    # Root image files fallback (e.g. /about_hero_model.jpg)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        root /var/www/pretty-vision/frontend/dist;
        try_files $uri /var/www/pretty-vision/backend/uploads$uri @backend;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Authentication API Endpoints
    location /api/auth/ {
        limit_req zone=pv_auth_limit burst=10 nodelay;
        limit_conn pv_conn_limit 10;

        proxy_pass http://pv_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Endpoints
    location /api/ {
        limit_req zone=pv_api_limit burst=30 nodelay;
        limit_conn pv_conn_limit 20;

        proxy_pass http://pv_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA Fallback: Any other path routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location @backend {
        proxy_pass http://pv_node_backend;
    }
}
